steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_DEPLOYMENT_ID=$BUILD_ID
      - -t
      - europe-west4-docker.pkg.dev/$PROJECT_ID/mychurch/web:$BUILD_ID
      - .
images:
  - europe-west4-docker.pkg.dev/$PROJECT_ID/mychurch/web:$BUILD_ID
timeout: 900s
options:
  logging: CLOUD_LOGGING_ONLY
