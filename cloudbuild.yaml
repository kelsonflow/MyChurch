steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_DEPLOYMENT_ID=$BUILD_ID
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - europe-west4-docker.pkg.dev/$PROJECT_ID/mychurch/web:$BUILD_ID
      - .
images:
  - europe-west4-docker.pkg.dev/$PROJECT_ID/mychurch/web:$BUILD_ID
timeout: 900s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SITE_URL: https://project-b8361f5e-fc32-4291-b37.web.app
